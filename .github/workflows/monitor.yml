name: OSINT monitor

on:
  schedule:
    # Every hour at minute 17 (UTC). GitHub can start scheduled runs a few minutes late.
    # Public repo: "*/30 * * * *" is fine. Private repo: keep hourly to stay inside the free Actions minutes.
    - cron: "17 * * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # push the database to the `data` branch

concurrency: # never run two monitors at once — they would overwrite each other's data
  group: osint-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - run: pip install -r requirements-worker.txt

      - name: Restore data from the data branch
        run: |
          if git fetch --depth=1 origin data; then
            # Working tree only: staging these files would make the save step's `git rm --cached` refuse
            git restore --source=FETCH_HEAD -- data
          else
            echo "No data branch yet: starting with an empty database"
          fi

      - name: Collect, analyze, alert
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: python main.py run

      # Saved even if the run step failed, so progress (and dedup/cooldown state) is never lost
      - name: Save data to the data branch
        if: ${{ !cancelled() && hashFiles('data/osint.db') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A single-commit orphan branch holds only the latest snapshot, so the repo never grows
          git checkout --orphan data-snapshot
          git rm -rq --cached .
          git add -f data/
          git commit -qm "Monitor data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin HEAD:data
