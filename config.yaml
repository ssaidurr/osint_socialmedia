# ─── Demo access ─────────────────────────────────────────────────────────────
# Visitors register once, then get a free trial. Registrations are rows in a Google Sheet:
# the app's own filesystem is wiped on every reboot, and the team reads the leads there.
# The deployed app needs `gsheet_id` and `[gcp_service_account]` in its Streamlit secrets;
# without them it refuses to open (set DEMO_OPEN=1 to work on it locally).
demo_access:
  enabled: true
  require: true
  trial_days: 14
  worksheet: users
  contact_email: "digitalmarketing.bizinc@gmail.com"   # shown when a trial ends — put the address people should write to
  admin_emails:               # these addresses walk straight in: no form, no trial, no sheet row
    - mssaidurr@gmail.com
    - nafiz.e.chy@gmail.com

# ─── Brief: what happened, in a few lines ─────────────────────────────────────
# The counts are computed in code; the LLM only turns the headlines into sentences.
# Without an LLM key a plain version is written instead.
digest:
  enabled: true
  windows: [6, 24, 72, 168, 720]   # one per time range in the dashboard: 6h, 24h, 3d, 7d, 30d
  every_hours: 6              # how often a brief is rewritten (each one costs one LLM call)
  max_stories: 45             # headlines sent per brief; near-duplicates are merged first
  email: true                 # send the 24h brief once a day
  email_hour: 9               # local hour (see `timezone` above) to send it

# ─── Ticket / email alert ─────────────────────────────────────────────────────
# A ticket is created (and emailed) when, within the last `window_hours`:
#   total analyzed items >= min_items
#   AND negative share   >= negative_ratio_threshold
#   AND negative items   >= min_negative_count
alert:
  recipients: [ffoisall@gmail.com]
  window_hours: 6
  min_items: 20
  # An ordinary hour measures anywhere between 35% and 59% negative, so a fixed number alone either
  # fires constantly or never. The bar is the HIGHER of:
  #   negative_ratio_threshold  — an absolute floor, and
  #   (the last `baseline_days` of this feed) + baseline_delta
  negative_ratio_threshold: 0.50
  baseline_days: 7            # what "normal" is measured over; 0 disables the baseline rule
  baseline_delta: 0.12        # how far above normal counts as a spike (12 percentage points)
  baseline_min_items: 200     # below this much history, fall back to the fixed floor
  min_negative_count: 10
  cooldown_hours: 6           # no repeat ticket within this time...
  escalation_delta: 0.15      # ...unless the negative share rose by this much since the last ticket
  top_items_in_email: 10

watch:
  interval_minutes: 30
