# Public Reddit posts + latest comments (no login needed)
reddit:
  subreddits: [worldnews, news, bangladesh, MiddleEast, geopolitics, india, pakistan]
  include_comments: true
  per_run: 4                    # feeds per run, taken in turn — Reddit 429s if you ask for them all
  searches: []                  # keyword search across all of Reddit, e.g. ["your brand"]
  search_limit: 25

# Public Telegram channels. No API key: the channel's public preview page is read.
# Most big outlets abandoned Telegram (CNN, AP, France 24 last posted in 2023).
# rtnews and sputniknews are still active but state-run — add them only if you want that in the mix.
telegram:
  channels: [bloomberg, thedailystar, almayadeen, trtworld, QudsNen]
  # almayadeen and trtworld are state-aligned newsrooms. They are here because they report what
  # the others do not, not because they are trusted — they are kept out of trusted_sources.
  limit: 40

# Public Mastodon hashtag timelines (open, no key)
mastodon:
  instances: [mastodon.social]
  tags: [worldnews, breakingnews, geopolitics, bangladesh, gaza, palestine, middleeast,
         iran, lebanon, ukraine, russia, china, india, africa, climate, economy]
  # #news and #politics were dropped: between them they were a quarter of everything collected,
  # almost all US chatter, and they drowned the regional feeds.
  limit: 40
  per_run: 6           # tags per run, in turn

# YouTube videos + comments. Needs YOUTUBE_API_KEY in .env (free, Google Cloud Console).
# Skipped automatically when no key is set.
# Free quota: search.list is capped at 100 calls/day and every run uses one call per query,
# so YouTube only runs every `every_minutes` (2 queries x 24 runs = 48 calls/day).
youtube:
  queries: ["world news", "Bangladesh news", "Middle East news"]
  region: ""                    # "" = worldwide; "US", "GB", "BD" ... to bias one country
  max_results: 15
  comments_per_video: 20
  lookback_hours: 24
  every_minutes: 60

analyzer:
  provider: auto              # auto picks the first key it finds: GEMINI_API_KEY, then ANTHROPIC_API_KEY,
                              # then OPENAI_API_KEY; none of them means the offline lexicon.
                              # gemini | claude | openai | lexicon to force one.
  gemini_model: gemini-3.5-flash-lite      # free tier; try gemini-3.5-flash for better accuracy
  gemini_min_seconds_between_requests: 6   # free tier allows only a few requests per minute
  claude_model: claude-opus-5
  claude_effort: low          # low is enough for classification; raise if accuracy is poor
  openai_model: gpt-5.4-mini  # OpenAI has no free tier; every call is billed
  batch_size: 50       # bigger batches mean fewer API calls for the same items
  max_items_per_run: 800   # keeps a run near 8 minutes; the rest waits for the next one

# ─── Credibility check (negative items) ───────────────────────────────────────
# NOT a "% true" score — nothing can compute that. It combines three measurable signals:
#   1. published fact-checks (Rumor Scanner, BOOM, AFP, Snopes, ...) matching the claim
#   2. how many independent sources carry the same story
#   3. what kind of source it is (established outlet vs. an unknown site vs. a comment)
credibility:
  enabled: true
  fact_check: true              # Google Fact Check Tools API; reuses YOUTUBE_API_KEY (or GOOGLE_API_KEY).
                                # Enable "Fact Check Tools API" in the same Google Cloud project first.
  fact_check_max_age_days: 0    # 0 = no age limit. Old debunks still matter — rumours come back around,
                                # and limiting to a year was measurably losing real matches.
  fact_check_skip_well_sourced: true   # skip the lookup (~2s each) for stories several trusted outlets carry
  fact_check_max_lookups: 30           # lookups per run. Each takes ~2s, and on GitHub Actions that time
                                       # is billed — 30 keeps a run at roughly a minute of lookups.
                                       # Doubtful items (comments, unknown sites) are checked first.
  fact_check_min_similarity: 0.30      # character-level similarity needed to accept a published fact-check
                                       # as being about this item. Calibrated on real pairs: same story
                                       # scored >= 0.39, unrelated stories <= 0.21. Raise it to be stricter.
  corroboration_window_hours: 48
  max_items_per_run: 120
  # Sources treated as established (substring match, case-insensitive)
  trusted_sources:
    - Reuters
    - Associated Press
    - AP News
    - AFP
    - BBC
    - Al Jazeera
    - The Guardian
    - New York Times
    - Washington Post
    - CNN
    - NPR
    - NBC News
    - CBS News
    - ABC News
    - Sky News
    - Deutsche Welle
    - France 24
    - Bloomberg
    - Financial Times
    - The Economist
    - Politico
    - Axios
    - Times of India
    - The Hindu
    - South China Morning Post
    - Kyodo
    - Anadolu
    - ReliefWeb
    - Middle East Eye
    - Al Monitor
    - t.me/bloomberg          # a newsroom's own Telegram channel counts as that newsroom
    # Bangladesh outlets
    - Prothom Alo
    - প্রথম আলো
    - The Daily Star
    - bdnews24
    - The Business Standard
    - Bangladesh Sangbad Sangstha
    - BSS
    - Dhaka Tribune
    - New Age
    - Jugantor
    - Samakal
    - Ittefaq
    - Kaler Kantho
    - Banglanews24
