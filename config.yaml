# ─── OSINT Social Media Monitor — configuration ───────────────────────────────
# Secrets (API key, SMTP password) go in .env, not here.

timezone: Asia/Dhaka          # used for display in emails and the dashboard
retention_days: 21            # items older than this are deleted so the database stays small (matters on GitHub)

# Google News. `topic` pulls a whole section, `query` searches a keyword.
# Topics: TOP, WORLD, NATION, BUSINESS, TECHNOLOGY, SCIENCE, HEALTH, SPORTS, ENTERTAINMENT
google_news:
  lang: en
  country: US
  window: 1d
  per_run: 10          # feeds per run, in turn — all 32 are covered across a few runs
  feeds:
    - { topic: TOP }
    - { topic: WORLD }
    - { topic: BUSINESS }
    - { topic: HEALTH }
    - { topic: WORLD, country: GB }     # UK edition — same section, different newsroom mix
    - { topic: WORLD, country: IN }     # India edition
    # A country's own news. NATION only returns anything for some editions — these were checked;
    # BD/en, UAE, Saudi, Egypt, Turkey and Qatar come back empty, so they are covered by search below.
    - { topic: NATION, lang: bn, country: BD }
    - { topic: NATION, country: PK }
    # Keyword searches reach what the topic feeds miss
    - { query: "Bangladesh", country: BD }
    - { query: "বাংলাদেশ", lang: bn, country: BD }
    - { query: "Middle East" }
    - { query: "Gaza" }
    - { query: "Saudi Arabia OR UAE OR Qatar" }
    - { query: "Iran" }
    - { query: "Dhaka" }
    - { query: "Bangladesh politics OR Bangladesh economy", country: BD }
    - { query: "Lebanon OR Yemen OR Syria" }
    - { query: "Egypt OR Turkey" }
    - { query: "Palestine" }
    # Outlets that block a direct feed request still show up through Google News
    - { query: "site:reuters.com" }
    - { query: "site:apnews.com" }
    - { query: "site:bloomberg.com" }
    - { query: "site:newagebd.net", country: BD }
    - { query: "site:bdnews24.com", country: BD }
    - { query: "site:jugantor.com", lang: bn, country: BD }
    - { query: "site:kalerkantho.com", lang: bn, country: BD }
    - { query: "site:samakal.com", lang: bn, country: BD }
    - { query: "site:ittefaq.com.bd", lang: bn, country: BD }
    - { query: "site:arabnews.com", country: SA }
    - { query: "site:english.alarabiya.net", country: AE }
    - { query: "site:gulfnews.com", country: AE }
    - { query: "site:thenationalnews.com", country: AE }
    # - { query: "your brand or topic" }

